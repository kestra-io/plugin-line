id: line-reject
namespace: io.kestra.tests

inputs:
  - id: url
    type: STRING
    defaults: "http://localhost:59443"

tasks:
  - id: line-rejected-notification
    type: io.kestra.plugin.line.LineExecution
    url: "{{ inputs.url }}/reject"
    channelAccessToken: "test-channel-access-token"
    executionId: "{{ trigger.executionId }}"
    customMessage: "should fail"

triggers:
  - id: on_success
    type: io.kestra.plugin.core.trigger.Flow
    preconditions:
      id: flow_trigger
      flows:
        - namespace: io.kestra.tests
          flowId: main-flow-for-reject
          states: [ SUCCESS ]
